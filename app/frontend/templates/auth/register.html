{% extends "base.html" %}


{% block styles %}

<link rel="stylesheet" href="{{ url_for('static', path='/css/auth.css') }}">

{% endblock %}


{% block content %}

<section class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <span class="auth-eyebrow">
                JOIN MY BLOG
            </span>

            <h1>
                Create an account
            </h1>

            <p>
                Register to create your account.
            </p>

        </div>


        <form class="auth-form" method="POST" action="/register">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input id="username" name="username" type="text" placeholder="Choose a username" autocomplete="username"
                    required>

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input id="email" name="email" type="email" placeholder="Enter your email" autocomplete="email"
                    required>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input id="password" name="password" type="password" placeholder="Create a password"
                    autocomplete="new-password" required>

                <span class="field-hint">
                    Use at least 8 characters.
                </span>

            </div>


            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input id="confirm_password" name="confirm_password" type="password"
                    placeholder="Enter your password again" autocomplete="new-password" required>

            </div>


            <label class="terms-row">

                <input type="checkbox" name="accept_terms" required>

                <span>
                    I agree to the Terms and Privacy Policy.
                </span>

            </label>


            <button type="submit" class="auth-submit">
                Create account
            </button>

        </form>


        <div class="auth-footer">

            <span>
                Already have an account?
            </span>

            <a href="/login">
                Login
            </a>

        </div>

    </div>

</section>

{% endblock %}
